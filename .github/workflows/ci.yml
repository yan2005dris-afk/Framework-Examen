name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Cambios detectados
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar qué stacks cambió
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            base="$HEAD_SHA~1"
          else
            base="$BEFORE_SHA"
          fi

          git diff --name-only "$base" "$HEAD_SHA" > cambios.txt || \
            git diff --name-only "$base~1" "$HEAD_SHA" > cambios.txt

          echo "Archivos modificados:"
          cat cambios.txt

          backend=false
          frontend=false

          # El workflow mismo es transversal: si cambia, se valida todo.
          if grep -qE '^apps/backend/|^[.]github/workflows/ci[.]yml$' cambios.txt; then
            backend=true
          fi

          # El frontend depende del lockfile y de los scripts de la raíz.
          if grep -qE '^apps/frontend/|^package[.]json$|^pnpm-lock[.]yaml$|^pnpm-workspace[.]yaml$|^[.]github/workflows/ci[.]yml$' cambios.txt; then
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/backend/go.sum

      - name: Formato (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Archivos sin gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Análisis estático (go vet)
        run: go vet ./...

      - name: Tests unitarios
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Código generado (sqlc) al día
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          if ! git diff --quiet -- internal/platform/sqlcgen; then
            echo "::error::El código de sqlc está desactualizado. Ejecuta 'make sqlc-generate' y versiona el resultado."
            git diff -- internal/platform/sqlcgen
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.out

  frontend:
    name: Frontend (React)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
        cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato (prettier)
        run: pnpm format:check

      - name: Lint (eslint)
        run: pnpm lint

      - name: Tests unitarios (vitest)
        run: pnpm test

      - name: Build y verificación de tipos (tsc + vite)
        run: pnpm build
