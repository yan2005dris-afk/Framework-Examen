# Compose de DESARROLLO. El de producción vive en deploy/.
#
# Cada servicio declara únicamente su Dockerfile: el contexto es la carpeta
# donde vive ese Dockerfile y no hay pasos de build en línea.

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    container_name: biess-frontend
    restart: unless-stopped
    environment:
      # Vite reenvía /api a la API Go: el navegador ve un solo origen.
      VITE_DEV_API_TARGET: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      # El código se monta para recargar al vuelo; node_modules vive en la
      # imagen para no perder las dependencias instaladas.
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./apps/frontend/components.json:/app/apps/frontend/components.json
      - ./apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts
      - ./apps/frontend/tsconfig.json:/app/apps/frontend/tsconfig.json
      - ./apps/frontend/tsconfig.app.json:/app/apps/frontend/tsconfig.app.json
      - ./apps/frontend/tsconfig.node.json:/app/apps/frontend/tsconfig.node.json
      - ./apps/backend/internal/submission/definition.json:/app/apps/backend/internal/submission/definition.json:ro
      - ./apps/backend/internal/submission/testdata:/app/apps/backend/internal/submission/testdata:ro
      - /app/node_modules
      - /app/apps/frontend/node_modules

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: biess-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://postgres@postgres:5432/biess?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://rustfs:9000/biess
      S3_PUBLIC_ENDPOINT: http://localhost:9000/biess
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_REGION: us-east-1
      # Correo: Mailpit captura todo lo que envía la API.
      MAIL_OUTBOX_KEY: ${MAIL_OUTBOX_KEY:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@biess.local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      rustfs:
        condition: service_started
    volumes:
      - ./apps/backend/data:/app/data

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  postgres:
    image: postgres:18-alpine
    container_name: biess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: biess
      # Solo para desarrollo: la base local no pide contraseña. En producción
      # la contraseña llega por variable de entorno.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 usa un directorio por versión mayor
      # (/var/lib/postgresql/18/docker). El montaje va en /var/lib/postgresql
      # y no en .../data, que es lo que exige la imagen desde la 18.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biess"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: biess-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # interfaz web
      - "1025:1025" # SMTP
    volumes:
      - mailpit-data:/data


  redis:
    image: redis:7-alpine
    container_name: biess-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  mailpit-data:
  redis-data:
  rustfs-data:
