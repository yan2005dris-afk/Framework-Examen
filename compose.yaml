# Compose de DESARROLLO. El de producción vive en deploy/.
#
# Cada servicio declara únicamente su Dockerfile: el contexto es la carpeta
# donde vive ese Dockerfile y no hay pasos de build en línea.

services:
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: biess-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://postgres@postgres:5432/biess?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/data:/app/data

  postgres:
    image: postgres:17-alpine
    container_name: biess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: biess
      # Solo para desarrollo: la base local no pide contraseña. En producción
      # la contraseña llega por variable de entorno.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biess"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
