name: framework-backend-demo
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-}
      POSTGRES_DB: framework_synthetic_demo
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d framework_synthetic_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels: {data.origin: synthetic-demo}
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis:/data"]
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    labels: {data.origin: synthetic-demo}
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${DEMO_S3_ACCESS_KEY:?run Start-Demo.ps1}
      RUSTFS_SECRET_KEY: ${DEMO_S3_SECRET_KEY:?run Start-Demo.ps1}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["objects:/data"]
    labels: {data.origin: synthetic-demo}
  mailpit:
    image: axllent/mailpit:latest
    environment: {MP_DATABASE: /data/mailpit.db}
    ports: ["127.0.0.1:18025:8025", "127.0.0.1:11025:1025"]
    volumes: ["mail:/data"]
    labels: {data.origin: synthetic-demo}
  api:
    image: framework-backend-demo-api:local
    build: {context: ../.., dockerfile: deploy/demo/Dockerfile}
    environment:
      APP_ENV: development
      APP_VERSION: synthetic-demo
      DATA_ORIGIN: synthetic-demo
      APP_URL: http://localhost:18081
      PORT: "8080"
      DATABASE_URL: postgres://postgres:${DEMO_DB_PASSWORD}@postgres:5432/framework_synthetic_demo?sslmode=disable
      DB_REQUIRED: "true"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:18080,http://localhost:18081,http://localhost:5173
      MAIL_OUTBOX_KEY: ${MAIL_OUTBOX_KEY:?run Start-Demo.ps1}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://rustfs:9000/synthetic-demo
      S3_PUBLIC_ENDPOINT: http://localhost:19000/synthetic-demo
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${DEMO_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${DEMO_S3_SECRET_KEY}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: synthetic-demo@example.test
      ELIGIBILITY_SIMULATION_FILE: /app/data/eligibility.json
      METRICS_ADDR: 0.0.0.0:9090
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:19090:9090"]
    volumes: ["../../apps/backend/data/synthetic-demo/${DEMO_DATASET:-.}:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rustfs: {condition: service_started}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD, /app/api, healthcheck]
      interval: 3s
      timeout: 3s
      retries: 30
    labels: {data.origin: synthetic-demo}
  gateway:
    image: nginx:alpine
    ports: ["127.0.0.1:18081:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: {api: {condition: service_healthy}}
    labels: {data.origin: synthetic-demo}
volumes:
  postgres: {name: "${DEMO_POSTGRES_VOLUME:-framework-backend-demo_postgres}", labels: {data.origin: synthetic-demo}}
  redis: {labels: {data.origin: synthetic-demo}}
  objects: {name: "${DEMO_OBJECT_VOLUME:-framework-backend-demo_objects}", labels: {data.origin: synthetic-demo}}
  mail: {labels: {data.origin: synthetic-demo}}
