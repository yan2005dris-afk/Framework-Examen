# Reverse proxy de producción.
#
# Un solo origen público: la SPA compilada se sirve desde nginx y /api se
# reenvía a la API Go. Así no hay CORS, las cookies son de primer nivel y el
# certificado TLS vive en un único lugar.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonda de salud del propio nginx, sin pasar por la SPA.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # La SPA enruta en el cliente: cualquier ruta desconocida devuelve el
    # index.html para que el router de React la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Go. El prefijo /api/ se conserva: la API enruta en /api/v1/...
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El index.html apunta al bundle vigente: nunca se cachea.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
